<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-m9hhujggSDaaWOkDzIqS+Xc4XOV4tZ2HPXUQ2zK8Cak='; style-src 'self' 'sha256-WUNEJp3Ty32QbIeJPWhKEZGMsQg94AYU2hbVJCVWymI='; font-src data:; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Number Bar</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fira-sans.css">
<link rel="stylesheet" href="blueberry-sunrise.css">
<style>
  /* blueberry-sunrise: every colour comes from blueberry-sunrise.css; only these are the widget's own */
  html[data-theme="light"] { color-scheme: normal; }
  :root { --label: #91918e; --asof: #6b6b68; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; }
  body { font-family: "Fira Sans", system-ui, sans-serif; padding: 4px 6px 10px; }
  .bar { display: flex; gap: 12px; }                       /* one row across, never stacked (20 Nov 2026) */
  .bar > * { flex: 1 1 0; min-width: 0; }
  .label { font-size: 12px; font-weight: 500; color: var(--label); margin: 0 0 5px 3px;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card { border: 2px solid var(--edge); border-radius: 12px; box-shadow: 0 3px 0 var(--lip);
          height: 52px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .num { font-size: 24px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
  .asof { font-size: 12px; font-weight: 500; color: var(--asof); margin: 8px 0 0 3px; }
  .bar.stale .card { filter: grayscale(1); opacity: .6; }
  .of { font-size: 13px; font-weight: 700; color: var(--ink); opacity: .55; }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="asof" id="asof" hidden></div>
<script>
  // The numbers ride in the part of the link after #, which a browser never sends to any server:
  // #s=[["label", "value", "colour", "of"], ...]&t=<unix seconds the numbers were worked out>&ttl=<lifetime, seconds>
  // colour: pink peach butter mint sky lav. Past t + ttl the bar greys; a link without t is never greyed.
  // Nothing read here is kept or sent anywhere, and the page's title never changes.
  // The hand-over: an old link carried them after ? instead. It is read once, so a bar never shows blank before the
  // tick has rewritten it, and taken out of the address at once (it was already sent; this only stops it lingering).
  const fragment = new URLSearchParams(String(location.hash || "").replace(/^#/, ""));
  const query = new URLSearchParams(location.search || "");
  const old = !fragment.has("s") && query.has("s");
  const params = old ? query : fragment;
  if (old && typeof history !== "undefined" && history.replaceState) history.replaceState(null, "", location.pathname);
  let stats = [];
  try { stats = JSON.parse(params.get("s") || "[]"); } catch (e) { stats = []; }
  if (!Array.isArray(stats)) stats = [];
  const bar = document.getElementById("bar");
  const COLOURS = ["pink", "peach", "butter", "mint", "sky", "lav"];
  function el(tag, cls, text) {
    const d = document.createElement(tag);
    if (cls) d.className = cls;
    if (text !== undefined) d.textContent = text;
    return d;
  }
  stats.forEach(row => {
    const [label, value, colour, of] = Array.isArray(row) ? row : [];
    const d = el("div"), card = el("div", "card");
    card.style.background = "var(--" + (COLOURS.includes(colour) ? colour : "lav") + ")";
    card.appendChild(el("span", "num", String(value)));
    if (of) card.appendChild(el("span", "of", "/ " + String(of)));
    d.appendChild(el("div", "label", String(label)));
    d.appendChild(card);
    bar.appendChild(d);
  });

  const t = Number(params.get("t")), ttl = Number(params.get("ttl"));
  const asof = document.getElementById("asof");
  function when() {
    if (!t) return "not updated yet";
    const d = new Date(t * 1000);
    if (isNaN(d)) return "";
    const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).toLowerCase();
    return "as of " + (d.toDateString() === new Date().toDateString() ? "" : d.toLocaleDateString([], { day: "numeric", month: "short" }) + ", ") + time;
  }
  function check() {
    if (!params.has("t") || !Number.isFinite(t) || t < 0) return;
    const stale = Number.isFinite(ttl) && ttl > 0 && Date.now() / 1000 > t + ttl;
    bar.classList.toggle("stale", stale);
    asof.textContent = stale ? when() : "";
    asof.hidden = !stale;
    bar.title = stale ? "" : when();
  }
  check();
  setInterval(check, 60000);
</script>
</body>
</html>
