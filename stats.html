<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* blueberry-sunrise:start (generated from the Blueberry Sunrise root d240ffb88b76; never edit by hand) */
  :root {
    --edge: #441d68; --lip: #441d68; --ink: #26143c; --ink-2: #55426f; --pink: #ffc2da; --peach: #ffcab0;
    --butter: #fef4b4; --mint: #9ef5cf; --sky: #b2dcff; --lav: #d6c1ff; --label: #91918e; --asof: #6b6b68;
  }
  /* blueberry-sunrise:end */
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; }
  body { font-family: "Fira Sans", system-ui, sans-serif; padding: 4px 6px 10px; }
  .bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 10px 12px; }
  .label { font-size: 12px; font-weight: 500; color: var(--label); margin: 0 0 5px 3px;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card { border: 2px solid var(--edge); border-radius: 12px; box-shadow: 0 3px 0 var(--lip);
          height: 52px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .num { font-size: 24px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
  .asof { font-size: 12px; font-weight: 500; color: var(--asof); margin: 8px 0 0 3px; }
  .bar.stale .card { filter: grayscale(1); opacity: .6; }
  .of { font-size: 13px; font-weight: 700; color: var(--ink); opacity: .55; }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="asof" id="asof" hidden></div>
<script>
  // ?s=[["label", "value", "colour", "of"], ...]  colour: pink peach butter mint sky lav
  // Optional &t=<unix seconds the numbers were worked out>&ttl=<lifetime in seconds>: past t + ttl the bar greys.
  // A link without t is never greyed.
  const params = new URLSearchParams(location.search);
  let stats = [];
  try { stats = JSON.parse(params.get("s") || "[]"); } catch (e) { stats = []; }
  if (!Array.isArray(stats)) stats = [];
  const bar = document.getElementById("bar");
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  stats.forEach(row => {
    const [label, value, colour, of] = Array.isArray(row) ? row : [];
    const d = document.createElement("div");
    d.innerHTML = `<div class="label">${esc(label)}</div><div class="card" style="background: var(--${esc(colour || "lav")})">` +
      `<span class="num">${esc(value)}</span>${of ? `<span class="of">/ ${esc(of)}</span>` : ""}</div>`;
    bar.appendChild(d);
  });

  const t = Number(params.get("t")), ttl = Number(params.get("ttl"));
  const asof = document.getElementById("asof");
  function when() {
    if (!t) return "not updated yet";
    const d = new Date(t * 1000);
    if (isNaN(d)) return "";
    const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).toLowerCase();
    return "as of " + (d.toDateString() === new Date().toDateString() ? "" : d.toLocaleDateString([], { day: "numeric", month: "short" }) + ", ") + time;
  }
  function check() {
    if (!params.has("t") || !Number.isFinite(t) || t < 0) return;
    const stale = Number.isFinite(ttl) && ttl > 0 && Date.now() / 1000 > t + ttl;
    bar.classList.toggle("stale", stale);
    asof.textContent = stale ? when() : "";
    asof.hidden = !stale;
    bar.title = stale ? "" : when();
  }
  check();
  setInterval(check, 60000);
</script>
</body>
</html>
